apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: loading-dock-runner-v2
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    spec:
      parallelism: 1
      taskCount: 1
      template:
        spec:
          maxRetries: 0
          timeoutSeconds: 3600
          containers:
            - image: IMAGE_URL
              env:
                - name: BUILD_PLATFORM
                  value: android
                - name: BUILD_PROFILE
                  value: preview
                - name: BUILD_OUTPUT_DIRECTORY
                  value: /build/output
                - name: BUILD_WORKSPACE_DIRECTORY
                  value: /build
                - name: BUILD_MAX_RAM_USAGE
                  value: "4g"
                - name: TMPDIR
                  value: /build/tmp
                - name: EAS_LOCAL_BUILD_WORKINGDIR
                  value: /build/eas
                - name: EAS_LOCAL_BUILD_ARTIFACTS_DIR
                  value: /build/output
                - name: RUN_EXPO_DOCTOR
                  value: "true"
              resources:
                limits:
                  cpu: "4"
                  memory: 16Gi
              volumeMounts:
                - name: build-disk
                  mountPath: /build
          volumes:
            - name: build-disk
              emptyDir:
                medium: Disk
                sizeLimit: 10Gi
